name: Check requested greeting audio on FREE CPU
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: greeting-asr-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned official whisper.cpp on CPU
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/greeting-asr"
          mkdir -p "$work"
          git clone https://github.com/ggml-org/whisper.cpp.git "$work/src"
          git -C "$work/src" checkout --detach 284029c07012d2000941a08d38a31ffb71f4734e
          cmake -S "$work/src" -B "$work/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$work/build" --target whisper-cli -j2 --config Release
          cd "$work/src"
          sh ./models/download-ggml-model.sh medium
          echo 'fd9727b6e1217c2f614f9b698455c4ffd82463b4  models/ggml-medium.bin' | sha1sum -c -
      - name: Download only the requested prepared clips
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const base='https://raw.githubusercontent.com/alstnslasla-web/youngwoong-haru/refs/heads/main/';
          const rows=[{"id":"prefix","text":"은자야."},{"id":"morning","text":"은자야. 좋은 아침이야."},{"id":"night","text":"은자야. 잘 자. 좋은 꿈 꿔. 오늘 하루도 고생했어."},{"id":"changed-1","text":"은자님을 위한 팬메이드 동행 도우미예요. 제공된 AI 샘플로 만든 합성 안내이며, 실제 임영웅의 녹음이나 대화가 아니에요. 오늘도 천천히 쉬어가요. 대화 내용과 개인 일정, 할 일은 읽거나 외부로 보내지 않아요."},{"id":"changed-2","text":"은자님 전용 AI 안내예요. 제공된 AI 샘플로 만든 합성 음성이며 실제 임영웅의 녹음·발언·의료 추천이 아니에요. 개인 기록은 읽거나 외부로 보내지 않아요. 준비된 호칭과 공개 안내만 재생해요. 인터넷에서 처음 내려받고, 저장된 음성만 오프라인으로 들어요."},{"id":"changed-3","text":"은자님 전용 설정이에요. 글자를 크고 진하게 바꿀 수 있어요. 개인 기록은 읽지 않아요."}];
          const out=path.join(process.env.RUNNER_TEMP,'greeting-asr');
          let idx;
          for(let n=0;n<30;n++){
            const r=await fetch(base+'voice-index.json?asr='+Date.now(),{signal:AbortSignal.timeout(20000)});
            if(r.ok){const j=await r.json();if(j.model!=='Qwen/Qwen3-TTS-12Hz-0.6B-Base'||j.vendorCommit!=='022e286b98fbec7e1e916cb940cdf532cd9f488e'||j.referenceSha256!=='39eb74c151d439ea2f41ad53a7e11560cfe407793d8323be3a2e30d5193d5cb5')throw Error('Provenance mismatch');if(rows.every(x=>{const h=createHash('sha256').update(x.text).digest('hex');return j.clips?.[h]?.text===x.text;})){idx=j;break;}}
            await new Promise(r=>setTimeout(r,20000));
          }
          if(!idx)throw Error('Requested greeting assets not ready within bounded wait');
          for(const row of rows){const hash=createHash('sha256').update(row.text).digest('hex'),c=idx.clips[hash];if(c.src!=='./voice-clips/'+hash+'.mp3'||c.bytes>2097152)throw Error('Clip path or size');const r=await fetch(base+c.src.slice(2)+'?asr='+Date.now(),{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('Clip HTTP');const b=Buffer.from(await r.arrayBuffer());if(b.length!==c.bytes)throw Error('Clip bytes');await fs.writeFile(path.join(out,row.id+'.mp3'),b);row.audioSha256=createHash('sha256').update(b).digest('hex');row.bytes=b.length;}
          const ref=await fs.readFile('voice-reference.wav');if(createHash('sha256').update(ref).digest('hex')!=='39eb74c151d439ea2f41ad53a7e11560cfe407793d8323be3a2e30d5193d5cb5')throw Error('Reference identity');await fs.writeFile(path.join(out,'reference.wav'),ref);rows.push({id:'reference',text:'안녕하세요. 좋은 아침이에요. 잘 잤어요?',audioSha256:createHash('sha256').update(ref).digest('hex'),bytes:ref.length});await fs.writeFile(path.join(out,'inputs.json'),JSON.stringify(rows));
          NODE
      - name: Ensure FFmpeg PCM converter is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Transcribe full files from time zero without prompt or trimming
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/greeting-asr"
          for name in prefix morning night changed-1 changed-2 changed-3 reference; do
            source="$work/$name.mp3"
            if test "$name" = reference; then source="$work/reference.wav"; fi
            ffmpeg -nostdin -y -v error -i "$source" -ar 16000 -ac 1 -c:a pcm_s16le "$work/$name-16k.wav"
            "$work/build/bin/whisper-cli" -m "$work/src/models/ggml-medium.bin" -l ko -ng -f "$work/$name-16k.wav" -otxt -oj -of "$work/$name-transcript"
          done
      - name: Report text and audio fingerprints, not listening approval
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const root=path.join(process.env.RUNNER_TEMP,'greeting-asr'),rows=JSON.parse(await fs.readFile(path.join(root,'inputs.json'),'utf8'));
          const normalize=s=>s.normalize('NFC').replace(/[^가-힣a-zA-Z0-9]/g,'').toLowerCase();
          for(const row of rows){row.transcript=(await fs.readFile(path.join(root,row.id+'-transcript.txt'),'utf8')).trim();row.normalizedTextMatch=normalize(row.text)===normalize(row.transcript);row.startsWithFixedName=["prefix","morning","night"].includes(row.id)?normalize(row.transcript).startsWith("은자야"):null;}
          const report={model:'whisper.cpp multilingual medium',vendorCommit:'284029c07012d2000941a08d38a31ffb71f4734e',language:'ko',noGpu:true,noPrompt:true,noTrimming:true,checkedAt:new Date().toISOString(),rows,caveat:'ASR can omit, hallucinate or misrecognize words. Not human listening, speaker identity, authorization or perfect absence-of-extra-speech proof.'};
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,'## Requested greeting ASR check\n\n'+JSON.stringify(report,null,2)+'\n');
          NODE
# Manual only. No uploads, commits, deployment, models or saved prompts published.
